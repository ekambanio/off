<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EKAMBANI Subscription Renewal</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#f1f5f9;font-family:Arial}.card{width:100%;max-width:430px;padding:24px;background:white;border-radius:16px;box-shadow:0 8px 28px #0002}h2{text-align:center;color:#09874a}label{display:block;margin:14px 0 6px;font-weight:bold;font-size:13px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}input[readonly]{background:#f1f5f9}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:#09874a;color:white;font-weight:bold}button:disabled{opacity:.5}#newUser{display:none;margin-top:6px;padding:10px 12px;border:1px dashed #cbd5e1;border-radius:10px}#newUser label{margin:8px 0 4px;font-size:12px}#newUser input{padding:9px 10px;font-size:14px}#newUser .note{margin:0 0 4px;font-size:12px;color:#64748b}#regBtn{padding:10px;margin-top:12px;font-size:14px}#msg{display:none;margin-top:14px;padding:11px;border-radius:8px;white-space:pre-line;font-size:13px}#msg.info{display:block;background:#dbeafe;color:#1e40af}#msg.error{display:block;background:#fee2e2;color:#991b1b}#msg.success{display:block;background:#dcfce7;color:#166534}</style></head><body><main class="card"><h2>EKAMBANI</h2><p style="text-align:center;color:#64748b">Subscription Renewal</p><label>Device ID</label><input id="deviceId" readonly placeholder="Loading Device ID"><div id="newUser"><p class="note">New device: please register your details.</p><label for="custPhone">Phone Number</label><input id="custPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="e.g. 0712345678" required><label for="custName">Full Name</label><input id="custName" type="text" autocomplete="name" maxlength="80" placeholder="Your full name" required><button id="regBtn" type="button" onclick="registerNew()">Register Device</button></div><label>Renewal Code</label><input id="renewalCode" autocomplete="off" placeholder="Enter Renewal Code"><button id="btn" onclick="renew()" disabled>Renew Subscription</button><div id="msg" role="status"></div></main><script>let id='';function say(t,c){let e=document.getElementById('msg');e.textContent=t;e.className=c||'info'}function load(){google.script.url.getLocation(loc=>{id=String(loc&&loc.parameter&&loc.parameter.deviceId||'').trim();document.getElementById('deviceId').value=id;document.getElementById('btn').disabled=!id;if(!id){say('Device ID missing. Open this page from EKAMBANI POS.','error');return}say('Registering Device ID...');google.script.run.withSuccessHandler(done).withFailureHandler(e=>say(e&&e.message||'Server error','error')).registerDeviceForHtml(id,'','')})}function done(r){if(r&&r.needsDetails){document.getElementById('newUser').style.display='block';document.getElementById('btn').disabled=true;say('New device. Enter your Phone Number and Full Name, then tap Register Device.');return}say(r&&r.ok?(r.subscriptionStatus==='active'?'Subscription active ('+(r.remainingDays||0)+' days remaining). Return to POS. A new code adds its days to the remaining days.':'Device registered. Enter your Renewal Code.'):(r&&r.message||'Registration failed.'),r&&r.ok?'info':'error');if(r&&r.ok){document.getElementById('newUser').style.display='none';document.getElementById('btn').disabled=!id}}function registerNew(){let p=document.getElementById('custPhone').value.trim(),n=document.getElementById('custName').value.trim(),b=document.getElementById('regBtn');if(!p||!n){say('Phone Number and Full Name are required.','error');return}b.disabled=true;say('Registering...');google.script.run.withSuccessHandler(r=>{b.disabled=false;done(r)}).withFailureHandler(e=>{b.disabled=false;say(e&&e.message||'Server error','error')}).registerDeviceForHtml(id,p,n)}function renew(){let c=document.getElementById('renewalCode').value.trim(),b=document.getElementById('btn');if(!c){say('Enter Renewal Code.','error');return}b.disabled=true;b.textContent='Processing...';google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Renew Subscription';say(r&&r.message||'No response',r&&r.status?'success':'error')}).withFailureHandler(e=>{b.disabled=false;b.textContent='Renew Subscription';say(e&&e.message||'Renewal failed','error')}).renewSubscription(id,c)}document.addEventListener('DOMContentLoaded',load)</script></body></html>
